<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d18">
  <meta name="description" content="LifeOS — your personal schedule, habits, nutrition, workouts and expenses tracker.">
  <title>LifeOS — Personal Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css">
  <script src="./src/main.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="LifeOS home">
        <span class="brand-mark">L</span><span>LifeOS</span><span class="version">2.5 PRO</span>
      </a>
      <div class="top-actions">
        <span id="todayLabel" class="today-label"></span>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch theme" title="Switch theme"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="nav-label">WORKSPACE</div>
        <button class="nav-item active" data-page="dashboard" type="button"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></span> Overview</button>
        <button class="nav-item" data-page="schedule" type="button"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h3m-3 3h7"/></svg></span> Schedule</button>
        <button class="nav-item" data-page="habits" type="button"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4m0 10v4M3 12h4m10 0h4M5.6 5.6l2.8 2.8m7.2 7.2 2.8 2.8m0-12.8-2.8 2.8m-7.2 7.2-2.8 2.8"/><circle cx="12" cy="12" r="3.5"/></svg></span> Habits</button>
        <button class="nav-item" data-page="food" type="button"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v7m-3-7v4a3 3 0 0 0 6 0V3M7 10v11M16 3c-2 3-2 7 0 9h3V3m-3 9v9"/></svg></span> Food & calories</button>
        <button class="nav-item" data-page="workouts" type="button"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9v6m-3-4v2m18-2v2m-3-4v6M6 12h12"/></svg></span> Workouts</button>
        <button class="nav-item" data-page="weight" type="button"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18l5-6 4 3 7-9"/><path d="M14 6h5v5"/><path d="M3 21h18"/></svg></span> Body weight</button>
        <button class="nav-item" data-page="expenses" type="button"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 15h3"/><circle cx="16" cy="14" r="2"/></svg></span> Expenses</button>
        <div class="nav-divider"></div>
        <button class="nav-item" data-page="backup" type="button"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg></span> Backup & settings</button>
        <div class="sidebar-note"><span class="status-dot"></span> Offline-ready<br><small>Your data stays on this device.</small></div>
      </aside>
      <main id="app" class="main-content" tabindex="-1">
        <div class="loading">Loading LifeOS…</div>
      </main>
    </div>
    <footer class="footer">LifeOS 2.5 · Personal progress, one day at a time</footer>
  </div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
